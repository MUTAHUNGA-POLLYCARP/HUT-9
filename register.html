<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - HUT 9</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-container">
    <h2>Create Your Account</h2>
    <form id="register-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required />
      </div>
      <button type="submit" class="auth-btn">Sign Up</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="script.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Automatically route requests to Express port 5000 if running under Live Server (port 5500/5501)
      const API_URL = (window.location.port === '5500' || window.location.port === '5501')
        ? 'http://localhost:5000/api/register'
        : '/api/register';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();
        
        if (response.ok) {
          alert(data.message || 'Registration successful!');
          window.location.href = 'login.html';
        } else {
          alert(data.message || 'Registration failed.');
        }
      } catch (err) {
        console.error('Registration Error:', err);
        alert('Error connecting to server. Make sure node server.js is running.');
      }
    });
  </script>
</body>
</html>
