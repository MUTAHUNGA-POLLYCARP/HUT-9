<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - HUT 9</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dashboard-body">

  <nav class="navbar">
    <div class="logo">HUT 9 - Admin Panel</div>
    <div class="auth-controls">
      <a href="dashboard.html" class="nav-btn">User Portal</a>
      <button onclick="logoutUser()" class="btn-logout">Logout</button>
    </div>
  </nav>

  <main class="dashboard-container" style="max-width: 1100px;">
    
    <!-- Admin Overview Stats -->
    <section class="dashboard-stats">
      <div class="stat-box">
        <h4>Total Users</h4>
        <p id="admin-total-users">0</p>
      </div>
      <div class="stat-box">
        <h4>Pending Withdrawals</h4>
        <p id="admin-pending-withdrawals">0</p>
      </div>
      <div class="stat-box">
        <h4>Total System Balance</h4>
        <p id="admin-total-balance">UGX 0</p>
      </div>
    </section>

    <!-- Pending Withdrawals Management Table -->
    <section class="admin-section" style="margin-top: 2rem;">
      <h3 style="color: #00d8ff; margin-bottom: 1rem;">Pending Withdrawal Requests</h3>
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>User</th>
              <th>Phone</th>
              <th>Network</th>
              <th>Requested</th>
              <th>Fee (3%)</th>
              <th>Payout</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="withdrawal-table-body">
            <tr>
              <td colspan="7" style="text-align: center; color: #94a3b8;">No pending withdrawal requests.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="script.js"></script>
  <script>
    // Relative API endpoint for seamless local and production deployments
    const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000' 
      : '';

    document.addEventListener('DOMContentLoaded', fetchAdminData);

    async function fetchAdminData() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/admin/dashboard`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();

        if (response.ok) {
          document.getElementById('admin-total-users').textContent = data.totalUsers || 0;
          document.getElementById('admin-pending-withdrawals').textContent = data.pendingWithdrawals ? data.pendingWithdrawals.length : 0;
          
          const totalBalance = data.totalSystemBalance || 0;
          document.getElementById('admin-total-balance').textContent = `UGX ${totalBalance.toLocaleString()}`;

          renderWithdrawalsTable(data.pendingWithdrawals || []);
        } else {
          alert(data.message || 'Access denied.');
          window.location.href = 'index.html';
        }
      } catch (err) {
        console.error('Error fetching admin data:', err);
      }
    }

    // Helper function to safely escape text to prevent XSS
    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function renderWithdrawalsTable(withdrawals) {
      const tbody = document.getElementById('withdrawal-table-body');
      tbody.innerHTML = '';

      if (!withdrawals || withdrawals.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #94a3b8;">No pending withdrawal requests.</td></tr>';
        return;
      }

      withdrawals.forEach(item => {
        const tr = document.createElement('tr');
        
        // Handles both Mongoose '_id' and virtual 'id'
        const id = item._id || item.id;
        const amount = item.amount || 0;
        const fee = item.fee || 0;
        const netPayout = item.netPayout || 0;

        tr.innerHTML = `
          <td>${escapeHTML(item.username)}</td>
          <td>${escapeHTML(item.phoneNumber)}</td>
          <td>${escapeHTML(item.network)}</td>
          <td>UGX ${amount.toLocaleString()}</td>
          <td>UGX ${fee.toLocaleString()}</td>
          <td style="color: #00ffcc; font-weight: bold;">UGX ${netPayout.toLocaleString()}</td>
          <td>
            <button onclick="processWithdrawal('${id}', 'approve')" class="btn-action approve">Approve</button>
            <button onclick="processWithdrawal('${id}', 'reject')" class="btn-action reject">Reject</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function processWithdrawal(id, action) {
      const token = localStorage.getItem('token');
      try {
        const response = await fetch(`${API_BASE_URL}/api/admin/withdraw/${action}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ withdrawalId: id })
        });
        const data = await response.json();
        alert(data.message);
        fetchAdminData();
      } catch (err) {
        alert('Action failed.');
      }
    }
  </script>
</body>
</html>
